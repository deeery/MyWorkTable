<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>喝水提醒 · 每日饮水</title>
<link rel="stylesheet" href="../assets/theme.css">
<link rel="stylesheet" href="../assets/compact.css">
<style>
  :root { --accent: #38bdf8; --accent-2: #7dd3fc; }
  .glass { display: flex; gap: 5px; align-items: flex-end; height: 34px; }
  .glass i { width: 9px; height: 100%; border-radius: 3px; background: color-mix(in srgb, var(--muted) 22%, transparent); overflow: hidden; display: block; position: relative; }
  .glass i::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: linear-gradient(180deg, var(--accent-2), var(--accent)); transition: height .45s cubic-bezier(.3,1,.4,1); }
  .glass i.on::after { height: 100%; }
  .quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .wave { height: 40px; border-radius: 11px; background: color-mix(in srgb, var(--accent) 12%, transparent); overflow: hidden; position: relative; border: 1px solid var(--border); }
  .wave span { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 45%, transparent), color-mix(in srgb, var(--accent) 15%, transparent)); transition: height .5s; }
</style>
</head>
<body>
<div class="win" style="--w:400px">
  <header class="win-head">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="win-title"><span class="ico">💧</span>喝水提醒<span class="win-sub">每日饮水</span></div>
    <div class="spacer"></div>
    <span class="badge" id="streak">🔥 0 天</span>
  </header>

  <div class="win-body">
    <div class="card row between">
      <div class="col" style="gap:6px">
        <div class="stat"><b id="ml">0</b><span>今日饮水 (ml)</span></div>
        <div class="glass" id="glass"></div>
        <span class="tiny muted" id="tip">还差 0 杯达标</span>
      </div>
      <div class="ring" id="ring" style="--size:118px;--thick:11px">
        <div><b id="pct">0%</b><span>目标进度</span></div>
      </div>
    </div>

    <div class="wave"><span id="wave"></span></div>

    <div class="quick">
      <button class="btn" data-add="200">+200</button>
      <button class="btn" data-add="250">+250</button>
      <button class="btn" data-add="350">+350</button>
      <button class="btn primary" data-add="500">+500</button>
    </div>

    <div class="card col" style="gap:9px">
      <div class="row between">
        <span class="small bold">提醒设置</span>
        <span class="badge" id="cd">15:00</span>
      </div>
      <div class="row">
        <span class="small muted" style="width:52px">间隔</span>
        <select id="interval" style="flex:1">
          <option value="15">每 15 分钟</option>
          <option value="30" selected>每 30 分钟</option>
          <option value="45">每 45 分钟</option>
          <option value="60">每 60 分钟</option>
        </select>
      </div>
      <div class="row">
        <span class="small muted" style="width:52px">每日目标</span>
        <input type="range" id="goal" min="4" max="16" value="8" style="flex:1">
        <span class="badge" id="goalTxt">8 杯</span>
      </div>
      <label class="inline"><input type="checkbox" id="sound" checked> 到点播放提示音</label>
    </div>

    <div class="row between">
      <span class="small bold">今日记录</span>
      <button class="btn sm" id="undo">↩︎ 撤销</button>
    </div>
    <div class="list scroll" id="list" style="--scroll-h:150px"></div>

    <!-- 跨插件联动：读取 #26 习惯打卡的今日完成情况 -->
    <div class="card link" id="linkHabit" hidden>
      <div class="row between">
        <span class="small bold">🔥 联动 · 习惯打卡（#26）</span>
        <span class="badge" id="linkHabitBadge">—</span>
      </div>
      <div class="bar thin"><i id="linkHabitBar" style="width:0%"></i></div>
      <div class="tiny muted" id="linkHabitText">还没有习惯数据，去 #26 加一个吧喵~</div>
    </div>
  </div>

  <footer class="win-foot">
    <span class="dot live"></span><span id="foot">下次提醒 30:00 后</span>
    <div class="spacer" style="flex:1"></div>
    <span class="tiny">连续达标 <b id="footStreak">0</b> 天</span>
  </footer>
</div>

<script src="../assets/pl.js"></script>
<script src="../assets/compact.js"></script>
<script>
(function () {
  const { $, $$, toast, notify, beep, store, pad, fmtTime, today, pick } = PL;

  let goal = store.get('goal', 8);
  let logs = store.get('logs-' + today(), []);
  let streak = store.get('streak', 3);
  let intervalMin = 30, left = intervalMin * 60;
  const CUP = 250;
  const TIPS = ['喝口水吧，喵酱提醒你~', '补水时间到，站起来倒杯水 🚰', '身体在等你的一杯水 💧', '小口慢饮，比一次猛灌更健康'];

  /* ============================================================
     跨插件联动：读取 #26 习惯打卡的今日完成情况
     ------------------------------------------------------------
     PL.store 用统一前缀 'pl:' 且共享同源 localStorage，故可直接读
     #26 的 habits（每个习惯含 log: { 'YYYY-MM-DD': true }）。

     只读不写；#26 未安装/未打开过时安全降级，不报错、不显示 NaN。
     ============================================================ */
  const LINK = {
    /** 今日日期键，与 #26 的 dstr() 格式保持一致 */
    key() {
      const d = new Date();
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    },
    habits() {
      try {
        const h = store.get('habits', null);
        return Array.isArray(h) ? h : [];
      } catch (e) { return []; }
    },
    /** [今日已打卡数, 习惯总数]；无数据返回 [0,0] */
    today() {
      const hs = this.habits(), k = this.key();
      if (!hs.length) return [0, 0];
      const done = hs.filter(h => h && h.log && h.log[k]).length;
      return [done, hs.length];
    },
  };

  $('#goal').value = goal;
  $('#goalTxt').textContent = goal + ' 杯';

  function totalMl() { return logs.reduce((a, b) => a + b.ml, 0); }

  function render() {
    const ml = totalMl(), cups = logs.length;
    const pct = Math.min(100, Math.round(ml / (goal * CUP) * 100));
    $('#ml').textContent = ml.toLocaleString();
    $('#pct').textContent = pct + '%';
    $('#ring').style.setProperty('--p', pct);
    $('#wave').style.height = pct + '%';
    $('#streak').textContent = '🔥 ' + streak + ' 天';
    $('#footStreak').textContent = streak;
    $('#tip').textContent = pct >= 100 ? '今日目标已达成，好棒喵！' : '还差 ' + Math.max(0, goal - cups) + ' 杯达标';

    /* 联动 #26 习惯打卡：只读对方数据，无数据时整块隐藏 */
    const lhBox = $('#linkHabit');
    if (lhBox) {
      const [done, total] = LINK.today();
      if (total > 0) {
        lhBox.hidden = false;
        const hp = Math.round(done / total * 100);
        $('#linkHabitBar').style.width = hp + '%';
        $('#linkHabitBadge').textContent = done + ' / ' + total;
        $('#linkHabitBadge').className = 'badge ' + (done >= total ? 'ok' : 'warn');
        $('#linkHabitText').textContent = done >= total
          ? '今日习惯全部完成，厉害喵~ (｡･ω･｡)'
          : '今日还剩 ' + (total - done) + ' 个习惯没打卡';
      } else {
        lhBox.hidden = true;
      }
    }

    /* 杯子点阵 */
    const g = $('#glass'); g.innerHTML = '';
    for (let i = 0; i < goal; i++) {
      const i2 = document.createElement('i');
      if (i < cups) i2.className = 'on';
      g.appendChild(i2);
    }

    /* 记录列表 */
    const box = $('#list'); box.innerHTML = '';
    if (!logs.length) box.innerHTML = '<div class="empty">今天还没有喝水记录喵~</div>';
    logs.slice().reverse().forEach(l => {
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML = '<div class="av">💧</div><div class="grow"><div class="t">' + l.ml + ' ml</div>' +
        '<div class="s">' + l.at + ' 记录</div></div>' +
        '<span class="badge ' + (l.ml >= 350 ? 'ok' : '') + '">' + (l.ml >= 350 ? '大口喝' : '正常') + '</span>';
      box.appendChild(el);
    });
    store.set('logs-' + today(), logs);
  }

  $$('[data-add]').forEach(b => b.onclick = () => add(+b.dataset.add));
  function add(ml) {
    logs.push({ ml: ml, at: PL.fmtClock().slice(0, 5) });
    PL.beep(660, .1);
    toast('已记录 ' + ml + ' ml', 'ok');
    if (totalMl() >= goal * CUP && totalMl() - ml < goal * CUP) {
      streak++; store.set('streak', streak);
      setTimeout(() => { PL.chime(); toast('🎉 今日饮水目标达成！连续 ' + streak + ' 天', 'ok', 4000); }, 400);
    }
    left = intervalMin * 60;
    render();
  }

  $('#undo').onclick = () => {
    if (!logs.length) { toast('没有可撤销的记录', 'warn'); return; }
    const l = logs.pop(); render(); toast('已撤销 ' + l.ml + ' ml', 'warn');
  };

  $('#interval').onchange = e => {
    intervalMin = +e.target.value; left = intervalMin * 60;
    toast('提醒间隔已设为每 ' + intervalMin + ' 分钟', 'ok');
  };
  $('#goal').oninput = e => { goal = +e.target.value; $('#goalTxt').textContent = goal + ' 杯'; render(); };
  $('#sound').onchange = e => toast(e.target.checked ? '已开启提示音' : '已关闭提示音', e.target.checked ? 'ok' : 'warn');

  setInterval(() => {
    left--;
    if (left <= 0) {
      left = intervalMin * 60;
      if ($('#sound').checked) PL.chime();
      notify('💧 该喝水啦', pick(TIPS));
      toast(pick(TIPS), 'warn', 3600);
    }
    $('#cd').textContent = fmtTime(left);
    $('#foot').textContent = '下次提醒 ' + fmtTime(left) + ' 后';
    // 数据可能随记录/跨天变化，顺带刷新精简组件
    PL.compactRefreshAll();
  }, 1000);

  render();

  /* ============================================================
     桌面精简形态：今日完成环 / 饮水进度条 / 杯数
     ============================================================ */
  const cwf = PL.cwf;

  /** 今日目标总毫升数（目标杯数 × 每杯 250ml） */
  function goalMl() { return Math.max(1, goal * CUP); }

  PL.compact({
    id: 'water-reminder',
    name: '喝水提醒',
    icon: '💧',
    defFormat: 'ring',
    defSize: 'square',
    data: () => ({ ml: totalMl(), cups: logs.length, goal, streak }),
    formats: [
      {
        id: 'ring',
        name: '今日完成',
        icon: '⭕',
        options: [
          { key: 'label', type: 'text', label: '环下文字', def: '今日目标' },
        ],
        render: (o, d) => cwf.ring({
          pct: Math.min(100, d.ml / goalMl() * 100),
          label: o.label || '今日目标',
        }),
      },
      {
        id: 'bar',
        name: '饮水进度',
        icon: '📊',
        options: [
          { key: 'showName', type: 'bool', label: '显示名称', def: true },
          { key: 'sub', type: 'select', label: '副标题', def: 'left',
            options: [
              { value: 'left', label: '还差几杯' },
              { value: 'goal', label: '目标总量' },
              { value: 'none', label: '不显示' },
            ] },
        ],
        render: (o, d) => {
          const total = goalMl();
          const sub = o.sub === 'none' ? ''
            : o.sub === 'goal' ? '目标 ' + goal + ' 杯 · ' + total + ' ml'
            : '还差 ' + Math.max(0, goal - d.cups) + ' 杯达标';
          return cwf.bar({
            name: o.showName === false ? '' : '今日饮水',
            value: d.ml,
            unit: 'ml',
            pct: Math.min(100, d.ml / total * 100),
            sub,
          });
        },
      },
      {
        id: 'stat',
        name: '杯数',
        icon: '🔢',
        options: [
          { key: 'which', type: 'select', label: '显示哪个', def: 'cups',
            options: [
              { value: 'cups', label: '今日杯数' },
              { value: 'left', label: '还差几杯' },
              { value: 'streak', label: '连续达标天数' },
            ] },
          { key: 'showUnit', type: 'bool', label: '显示单位', def: true },
        ],
        render: (o, d) => {
          const which = o.which || 'cups';
          const v = which === 'left' ? Math.max(0, goal - d.cups)
            : which === 'streak' ? streak
            : d.cups;
          const u = which === 'streak' ? '天' : '杯';
          const nm = which === 'left' ? '还差杯数' : which === 'streak' ? '连续达标' : '今日饮水';
          return cwf.stat({ value: v, unit: o.showUnit === false ? '' : u, name: nm });
        },
      },
    ],
  });
})();
</script>
</body>
</html>
