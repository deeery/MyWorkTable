<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>快捷启动器 · 应用快速启动</title>
<link rel="stylesheet" href="../assets/theme.css">
<link rel="stylesheet" href="../assets/compact.css">
<style>
  :root { --accent: #0ea5e9; --accent-2: #38bdf8; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .app {
    display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 4px;
    border-radius: 13px; border: 1px solid transparent; background: transparent; cursor: pointer;
    transition: .16s; font: inherit; color: var(--text);
  }
  .app:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); border-color: color-mix(in srgb, var(--accent) 26%, transparent); }
  .app.sel { background: color-mix(in srgb, var(--accent) 18%, transparent); border-color: var(--accent); }
  .app .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 21px; box-shadow: 0 4px 10px -6px rgba(0,0,0,.5); }
  .app .nm { font-size: 10.5px; font-weight: 600; text-align: center; line-height: 1.2; }
  .app.launching .ic { animation: pop .35s ease; }
  .searchrow { display: flex; gap: 7px; align-items: center; }
  .searchrow input { flex: 1; }
  .hint { display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<div class="win" style="--w:440px">
  <header class="win-head">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="win-title"><span class="ico">🚀</span>快捷启动器<span class="win-sub">应用快速启动</span></div>
    <div class="spacer"></div>
    <span class="badge" id="cnt">0 个应用</span>
  </header>

  <div class="win-body">
    <div class="searchrow">
      <input type="search" id="q" placeholder="搜索应用…（支持拼音首字母，如 tx = 腾讯会议）">
      <button class="btn icon" id="favOnly" title="只看收藏">★</button>
    </div>

    <div class="tabs" id="tabs">
      <button class="active" data-c="all">全部</button>
      <button data-c="work">办公</button>
      <button data-c="dev">开发</button>
      <button data-c="media">影音</button>
      <button data-c="tool">工具</button>
    </div>

    <div class="row between">
      <span class="small bold" id="secTitle">最近使用</span>
      <span class="tiny muted" id="secTip">按使用次数排序</span>
    </div>
    <div class="grid" id="recent"></div>

    <div class="sep"></div>

    <div class="row between">
      <span class="small bold">全部应用</span>
      <span class="tiny muted" id="resTip"></span>
    </div>
    <div class="grid scroll" id="grid" style="--scroll-h:196px"></div>

    <div class="card row between">
      <div class="hint">
        <span class="kbd">↑</span><span class="kbd">↓</span><span class="tiny muted">选择</span>
        <span class="kbd">Enter</span><span class="tiny muted">启动</span>
        <span class="kbd">Esc</span><span class="tiny muted">清空</span>
      </div>
      <button class="btn sm primary" id="launch">启动选中</button>
    </div>
  </div>

  <footer class="win-foot">
    <span class="dot live"></span><span id="foot">已就绪，输入关键词快速定位</span>
    <div class="spacer" style="flex:1"></div>
    <span class="tiny">今日启动 <b id="todayN">0</b> 次</span>
  </footer>
</div>

<script src="../assets/pl.js"></script>
<script src="../assets/compact.js"></script>
<script>
(function () {
  const { $, $$, toast, beep, store, today, pick } = PL;

  /* ============================================================
     应用清单：从宿主拉取，不再写死
     ------------------------------------------------------------
     之前这里是 20 个硬编码的假应用，只增计数、不真启动。
     用户要的是「桌面菜单里有什么就能启动什么」—— 应用清单必须是
     宿主的真实数据。宿主侧（Workbench 的 registry）通过 postMessage
     下发 apps 列表，插件收到后渲染；拿不到就退回内置的兜底清单，
     保证单独打开（没有宿主）时也能看。
     ============================================================ */
  const FALLBACK_APPS = [
    { id: 'vscode',  n: 'VS Code',  ic: '🧩', c: 'dev',   col: '#0ea5e9', py: 'vsc', target: 'vsc' },
    { id: 'term',    n: '终端',     ic: '⌨️', c: 'dev',   col: '#334155', py: 'zd',  target: 'zd' },
    { id: 'word',    n: 'Word',     ic: '📄', c: 'work',  col: '#2563eb', py: 'word', target: 'word' },
    { id: 'excel',   n: 'Excel',    ic: '📊', c: 'work',  col: '#16a34a', py: 'excel', target: 'excel' },
    { id: 'meeting', n: '腾讯会议',  ic: '📹', c: 'work',  col: '#0ea5e9', py: 'txhy', target: 'txhy' },
    { id: 'music',   n: '音乐',     ic: '🎵', c: 'media', col: '#a855f7', py: 'yy',  target: 'yy' },
    { id: 'calc',    n: '计算器',   ic: '🧮', c: 'tool',  col: '#0ea5e9', py: 'jsq', target: 'jsq' },
    { id: 'shot',    n: '截图工具',  ic: '✂️', c: 'tool',  col: '#ef4444', py: 'jtgj', target: 'jtgj' },
  ];

  let APPS = store.get('app-list', null) || FALLBACK_APPS.slice();

  /**
   * 启动一个应用。
   *
   * 桌面壳（Electron）里 target 是可直接执行的目标（命令名 / URL / 文件路径），
   * 宿主会通过 wb:launch 消息转交主进程用 shell.openExternal / openPath 处理。
   * 浏览器里没有宿主，退回 window.open —— 至少能打开 URL 型目标，
   * 并在脚部说明为什么不能启动本地应用。
   */
  function launch(a) {
    if (!a) return;
    counts[a.id] = (counts[a.id] || 0) + 1;
    todayN++;
    store.set('app-today-' + today(), todayN);
    beep(760, .09); setTimeout(() => beep(980, .1), 110);
    const box = $('#grid').querySelector('[data-id="' + a.id + '"]') || $('#recent').querySelector('[data-id="' + a.id + '"]');
    if (box) { box.classList.add('launching'); setTimeout(() => box.classList.remove('launching'), 400); }

    // 告知宿主去启动；宿主负责把请求交给主进程执行
    let handled = false;
    try {
      parent.postMessage({ type: 'wb:launch', id: a.id, target: a.target, name: a.n }, '*');
      handled = true;
    } catch (e) { /* 脱离 iframe 时忽略 */ }

    if (handled) {
      $('#foot').textContent = '已启动 ' + a.n + ' · 累计 ' + counts[a.id] + ' 次';
      toast('🚀 正在启动 ' + a.n + ' …', 'ok');
    } else {
      // 没有宿主（单独打开）：URL 型还能开，本地程序做不到，如实说明
      const t = String(a.target || '');
      if (/^https?:/i.test(t)) {
        window.open(t, '_blank', 'noopener');
        $('#foot').textContent = '已在浏览器打开 ' + a.n;
        toast('🚀 已打开 ' + a.n, 'ok');
      } else {
        $('#foot').textContent = '无法启动 ' + a.n + '（需在 Workbench 桌面壳内运行）';
        toast('浏览器里不能启动本地应用喵~', 'warn');
      }
    }
    render();
  }

  /** 接收宿主下发：应用清单 / 启动结果 */
  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || typeof d.type !== 'string') return;
    // 宿主也可以反过来要清单（如宿主侧缓存失效时），应答一次
    if (d.type === 'wb:apps-request') {
      try { parent.postMessage({ type: 'wb:apps-request' }, '*'); } catch (err) {}
      return;
    }
    if (d.type === 'wb:launch-result') {
      if (d.ok) {
        $('#foot').textContent = '已启动 ' + d.name + ' · 累计 ' + (counts[d.id] || 0) + ' 次';
        toast('✅ ' + d.name + ' 启动完成', 'ok');
      } else {
        $('#foot').textContent = d.name + ' 启动失败：' + (d.err || '未知原因');
        toast('⚠ ' + d.name + ' 启动失败', 'warn');
      }
    }
    // 宿主下发的应用清单：字段与内置结构一致，直接替换即可
    if (d.type === 'wb:apps' && Array.isArray(d.apps) && d.apps.length) {
      APPS = d.apps.map(a => ({
        id: String(a.id || a.n || Math.random()),
        n: String(a.n || a.name || a.id || '未命名'),
        ic: a.ic || '📦',
        c: a.c || 'tool',
        col: a.col || '#64748b',
        py: a.py || '',
        target: a.target || a.path || a.n,
      }));
      store.set('app-list', APPS);
      render();
      // 精简形态的清单也是从 APPS 来的，宿主换了清单得让组件重绘
      try { PL.compactRefreshAll && PL.compactRefreshAll(); } catch (e) {}
    }
  });

  // 向宿主要应用清单。发两遍：DOM 就绪前宿主可能还没挂监听
  const askForApps = () => {
    try { parent.postMessage({ type: 'wb:apps-request' }, '*'); } catch (e) {}
  };
  askForApps();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', askForApps);
  else setTimeout(askForApps, 300);

  let counts = store.get('app-counts', { vscode: 12, term: 9, mail: 7, meeting: 6, music: 5, word: 4 });
  let favs = store.get('app-favs', ['vscode', 'meeting', 'music']);
  let cat = 'all', favOnly = false, sel = 0, todayN = store.get('app-today-' + today(), 0), list = [];

  function matches(a, q) {
    if (!q) return true;
    q = q.toLowerCase();
    return a.n.toLowerCase().includes(q) || a.id.includes(q) || (a.py || '').includes(q) || a.c.includes(q);
  }

  function compute() {
    const q = $('#q').value.trim();
    list = APPS.filter(a => (cat === 'all' || a.c === cat) && matches(a, q) && (!favOnly || favs.includes(a.id)));
    if (q) list.sort((a, b) => (b.n.toLowerCase().startsWith(q) ? 1 : 0) - (a.n.toLowerCase().startsWith(q) ? 1 : 0));
    sel = Math.max(0, Math.min(sel, list.length - 1));
  }

  function appEl(a) {
    const el = document.createElement('button');
    el.className = 'app' + (list[sel] && list[sel].id === a.id ? ' sel' : '');
    el.dataset.id = a.id;
    el.innerHTML = '<span class="ic" style="background:' + a.col + '22;color:' + a.col + '">' + a.ic + '</span>' +
      '<span class="nm">' + a.n + '</span>' +
      (favs.includes(a.id) ? '<span class="tiny" style="color:var(--warn)">★</span>' : '<span class="tiny muted">' + (counts[a.id] || 0) + ' 次</span>');
    return el;
  }

  function render() {
    compute();
    /* 最近使用 */
    const recent = APPS.slice().sort((a, b) => (counts[b.id] || 0) - (counts[a.id] || 0)).slice(0, 4);
    const rb = $('#recent'); rb.innerHTML = '';
    recent.forEach(a => rb.appendChild(appEl(a)));

    /* 全部 */
    const g = $('#grid'); g.innerHTML = '';
    if (!list.length) g.innerHTML = '<div class="empty" style="grid-column:1/-1">没有找到匹配的应用喵~<br>试试 "vsc"、"会议" 或 "tx"</div>';
    list.forEach(a => g.appendChild(appEl(a)));

    $('#cnt').textContent = APPS.length + ' 个应用';
    $('#resTip').textContent = list.length + ' / ' + APPS.length + (favOnly ? ' · 仅收藏' : '');
    $('#secTitle').textContent = $('#q').value.trim() ? '最近使用' : '最近使用';
    $('#favOnly').className = 'btn icon' + (favOnly ? ' primary' : '');
    $('#todayN').textContent = todayN;
    store.set('app-counts', counts);
    store.set('app-favs', favs);
  }

  $('#q').oninput = () => { sel = 0; render(); };
  $('#grid').onclick = e => {
    const b = e.target.closest('.app');
    if (!b) return;
    const a = APPS.find(x => x.id === b.dataset.id);
    launch(a);
  };
  $('#recent').onclick = e => {
    const b = e.target.closest('.app');
    if (!b) return;
    launch(APPS.find(x => x.id === b.dataset.id));
  };
  /* 右键（或双击）切换收藏 */
  ['grid', 'recent'].forEach(id => {
    $('#' + id).oncontextmenu = e => {
      const b = e.target.closest('.app');
      if (!b) return;
      e.preventDefault();
      toggleFav(b.dataset.id);
    };
  });
  function toggleFav(id) {
    const a = APPS.find(x => x.id === id);
    if (favs.includes(id)) { favs = favs.filter(x => x !== id); toast('已取消收藏 ' + a.n, 'warn'); }
    else { favs.push(id); toast('已收藏 ' + a.n + ' ★', 'ok'); }
    render();
  }

  $('#favOnly').onclick = () => { favOnly = !favOnly; sel = 0; toast(favOnly ? '只看收藏的应用 ★' : '显示全部应用', favOnly ? 'ok' : 'info'); render(); };
  $('#launch').onclick = () => launch(list[sel]);

  $('#tabs').onclick = e => {
    const b = e.target.closest('button');
    if (!b) return;
    cat = b.dataset.c; sel = 0;
    $$('#tabs button').forEach(x => x.classList.toggle('active', x === b));
    render();
  };

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(list.length - 1, sel + 1); render(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); render(); }
    else if (e.key === 'Enter') { launch(list[sel]); }
    else if (e.key === 'Escape') { $('#q').value = ''; sel = 0; render(); toast('已清空搜索'); }
  });

  setInterval(() => {
    const a = list[sel];
    if (a) $('#foot').textContent = '选中：' + a.n + ' · 按 Enter 启动';
  }, 1500);

  render();

  /* ============================================================
     桌面精简形态：单图标 / 常用几个 / 收藏
     ============================================================ */
  const cwf = PL.cwf;

  /** 取精简组件要展示的应用 */
  function pickApp(o) {
    if (o.which === 'fav') return APPS.find(a => favs.includes(a.id)) || APPS[0];
    if (o.which === 'recent') {
      return APPS.slice().sort((a, b) => (counts[b.id] || 0) - (counts[a.id] || 0))[0] || APPS[0];
    }
    return APPS[0];
  }

  PL.compact({
    id: 'app-launcher',
    name: '快捷启动器',
    icon: '🚀',
    defFormat: 'icon',
    defSize: 'square',
    data: () => ({ apps: APPS, counts, favs }),
    formats: [
      {
        id: 'icon',
        name: '单图标',
        icon: '🚀',
        options: [
          { key: 'which', type: 'select', label: '显示哪个', def: 'first',
            options: [
              { value: 'first', label: '第一个应用' },
              { value: 'fav', label: '收藏的第一个' },
              { value: 'recent', label: '最常用的' },
            ] },
          { key: 'showName', type: 'bool', label: '显示应用名', def: true },
        ],
        render: (o) => {
          const a = pickApp(o) || {};
          return cwf.icon({
            emoji: a.ic, color: a.col, name: a.n,
            label: o.showName === false ? false : true,
          });
        },
      },
      {
        id: 'list',
        name: '常用几个',
        icon: '📋',
        options: [
          { key: 'max', type: 'num', label: '显示条数', def: 3, min: 2, max: 5 },
          { key: 'sort', type: 'select', label: '排序', def: 'count',
            options: [
              { value: 'count', label: '按使用次数' },
              { value: 'fav', label: '收藏优先' },
            ] },
        ],
        render: (o) => {
          let arr = APPS.slice();
          if (o.sort === 'fav') arr.sort((a, b) => (favs.includes(b.id) ? 1 : 0) - (favs.includes(a.id) ? 1 : 0));
          else arr.sort((a, b) => (counts[b.id] || 0) - (counts[a.id] || 0));
          const rows = arr.map(a => ({ icon: a.ic, text: a.n, right: (counts[a.id] || 0) + '次' }));
          return cwf.list({ rows, max: Number(o.max) || 3 });
        },
      },
      {
        id: 'stat',
        name: '今日启动数',
        icon: '🔢',
        options: [
          { key: 'label', type: 'text', label: '标签文字', def: '今日启动' },
        ],
        render: (o) => {
          const n = store.get('app-today-' + today(), 0);
          return cwf.stat({ value: n, unit: '次', name: o.label || '今日启动' });
        },
      },
    ],
  });
})();
</script>
</body>
</html>
